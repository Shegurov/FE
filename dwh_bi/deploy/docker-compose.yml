# Production scale-out stack — 100% free / open-source.
#
#   Redpanda   Kafka-compatible streaming bus (ingest)      — free, source-available
#   ClickHouse columnar MPP warehouse (storage + compute)   — Apache 2.0
#   Metabase   embedded BI / dashboards                      — AGPL, free to self-host
#
# This is a single-box demo of the topology. For 1e9 tx/day and 2000 TB you run
# a ClickHouse *cluster* (sharded + replicated) instead of one node — the DDL in
# clickhouse/schema.sql already partitions and tiers for that. See README.
#
#   docker compose -f deploy/docker-compose.yml up -d
#   # ClickHouse:  http://localhost:8123    Metabase: http://localhost:3000
services:
  redpanda:
    image: redpandadata/redpanda:latest
    command:
      - redpanda start
      - --smp 1 --memory 1G --overprovisioned
      - --kafka-addr PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:9092
    ports: ["9092:9092"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q Healthy"]
      interval: 10s
      timeout: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    ports: ["8123:8123", "9000:9000"]
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    volumes:
      - ./clickhouse/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ch_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  metabase:
    image: metabase/metabase:latest
    ports: ["3000:3000"]
    depends_on:
      clickhouse: {condition: service_healthy}
    environment:
      MB_DB_TYPE: h2

volumes:
  ch_data:
