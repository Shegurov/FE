<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DWH · BI Dashboard</title>
<style>
  :root {
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222c; --line:#2a2f3a;
    --txt:#e6e9ef; --mut:#9aa4b2; --accent:#5b9dff; --good:#3ecf8e;
    --warn:#f4b740; --bad:#f2555a; --c1:#5b9dff; --c2:#3ecf8e; --c3:#b48cff;
    --c4:#f4b740; --c5:#f2555a; --c6:#4dd0e1; --c7:#ff9e64;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f5f7fa; --panel:#fff; --panel2:#f0f3f8; --line:#e3e8ef;
      --txt:#1a2230; --mut:#5b6675; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--txt); }
  header { padding:20px 28px; border-bottom:1px solid var(--line);
    display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0; font-weight:650; letter-spacing:.2px; }
  header .sub { color:var(--mut); font-size:12.5px; }
  main { padding:22px 28px; max-width:1280px; margin:0 auto; }
  .kpis { display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); }
  .kpi { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px 18px; }
  .kpi .lbl { color:var(--mut); font-size:12px; text-transform:uppercase; letter-spacing:.6px; }
  .kpi .val { font-size:26px; font-weight:680; margin-top:6px; font-variant-numeric:tabular-nums; }
  .grid { display:grid; gap:16px; margin-top:18px;
    grid-template-columns:repeat(12,1fr); }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:16px 18px; overflow:hidden; }
  .card h2 { font-size:13.5px; margin:0 0 14px; font-weight:620; color:var(--txt); }
  .col-8 { grid-column:span 8; } .col-4 { grid-column:span 4; }
  .col-6 { grid-column:span 6; } .col-12 { grid-column:span 12; }
  @media (max-width:900px){ .col-8,.col-4,.col-6,.col-12{ grid-column:span 12; } }
  svg { width:100%; display:block; overflow:visible; }
  .axis { fill:var(--mut); font-size:11px; }
  table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
  th,td { text-align:right; padding:7px 8px; border-bottom:1px solid var(--line); }
  th:first-child,td:first-child { text-align:left; }
  th { color:var(--mut); font-weight:550; font-size:11.5px; text-transform:uppercase; letter-spacing:.4px; }
  .bar-cell { position:relative; }
  .legend { display:flex; flex-wrap:wrap; gap:12px; margin-top:12px; color:var(--mut); font-size:12px; }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; vertical-align:-1px; }
  .err { color:var(--bad); padding:20px; }
  .foot { color:var(--mut); font-size:12px; margin-top:24px; }
  .pill { font-size:11px; padding:2px 8px; border-radius:20px; background:var(--panel2); color:var(--mut); }
</style>
</head>
<body>
<header>
  <h1>Corporate Data Warehouse — BI</h1>
  <span class="sub">star-schema marts · base currency USD · <span class="pill">free / open-source stack</span></span>
</header>
<main id="app"><p class="sub">Loading…</p></main>
<script>
const fmt = new Intl.NumberFormat('en-US');
const money = n => '$' + new Intl.NumberFormat('en-US',{maximumFractionDigits:0}).format(n||0);
const money2 = n => '$' + new Intl.NumberFormat('en-US',{maximumFractionDigits:2}).format(n||0);
const COLORS = ['--c1','--c2','--c3','--c4','--c5','--c6','--c7'].map(v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim());

async function main(){
  let d;
  try { d = await (await fetch('/api/summary')).json(); }
  catch(e){ document.getElementById('app').innerHTML='<p class="err">Failed to load: '+e+'</p>'; return; }
  if(d.error){ document.getElementById('app').innerHTML='<p class="err">'+d.error+'</p>'; return; }
  const app = document.getElementById('app');
  app.innerHTML = `
    <section class="kpis">
      ${kpi('Revenue (settled)', money(d.revenue))}
      ${kpi('Gross volume', money(d.gross_amount))}
      ${kpi('Transactions', fmt.format(d.tx_count))}
      ${kpi('Customers', fmt.format(d.customers))}
      ${kpi('Fees collected', money(d.fees))}
      ${kpi('Avg ticket', money2(d.avg_ticket))}
    </section>
    <section class="grid">
      <div class="card col-8"><h2>Daily revenue &amp; transactions</h2><div id="trend"></div></div>
      <div class="card col-4"><h2>Revenue by currency (normalized to USD)</h2><div id="ccy"></div></div>
      <div class="card col-6"><h2>Top merchants by revenue</h2><div id="merch"></div></div>
      <div class="card col-6"><h2>Volume by channel</h2><div id="chan"></div></div>
    </section>
    <p class="foot">Every figure is computed in the warehouse from a normalized star schema. Mixed-currency
    inputs are converted to a single base currency during normalization, so totals reconcile exactly.</p>`;
  lineChart(document.getElementById('trend'), d.daily);
  donut(document.getElementById('ccy'), d.currency_mix);
  merchTable(document.getElementById('merch'), d.top_merchants);
  barChart(document.getElementById('chan'), d.channels);
}
function kpi(l,v){ return `<div class="kpi"><div class="lbl">${l}</div><div class="val">${v}</div></div>`; }

function lineChart(el, rows){
  if(!rows||!rows.length){ el.innerHTML='<p class="sub">no data</p>'; return; }
  const W=760,H=240,P={t:12,r:16,b:26,l:56};
  const xs=rows.map(r=>new Date(r.event_date)), ys=rows.map(r=>+r.revenue);
  const ymax=Math.max(...ys,1), x0=+xs[0], x1=+xs[xs.length-1]||x0+1;
  const px=t=>P.l+((+t)-x0)/(x1-x0||1)*(W-P.l-P.r);
  const py=v=>H-P.b-(v/ymax)*(H-P.t-P.b);
  const path=rows.map((r,i)=>(i?'L':'M')+px(xs[i])+' '+py(ys[i])).join(' ');
  const area=path+` L${px(xs[xs.length-1])} ${H-P.b} L${px(xs[0])} ${H-P.b} Z`;
  let ticks='';
  for(let i=0;i<=4;i++){ const v=ymax*i/4, y=py(v);
    ticks+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y}" y2="${y}" stroke="var(--line)"/>`+
           `<text class="axis" x="${P.l-8}" y="${y+3}" text-anchor="end">${money(v)}</text>`; }
  const step=Math.max(1,Math.floor(rows.length/6)); let xlab='';
  for(let i=0;i<rows.length;i+=step){ xlab+=`<text class="axis" x="${px(xs[i])}" y="${H-8}" text-anchor="middle">${String(rows[i].event_date).slice(5)}</text>`; }
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}">${ticks}
    <path d="${area}" fill="${COLORS[0]}" opacity="0.14"/>
    <path d="${path}" fill="none" stroke="${COLORS[0]}" stroke-width="2"/>${xlab}</svg>`;
}

function barChart(el, rows){
  if(!rows||!rows.length){ el.innerHTML='<p class="sub">no data</p>'; return; }
  const W=380,H=210,P={t:8,r:12,b:26,l:12}, n=rows.length;
  const max=Math.max(...rows.map(r=>+r.tx_count),1);
  const bw=(W-P.l-P.r)/n*0.6, gap=(W-P.l-P.r)/n;
  let b='';
  rows.forEach((r,i)=>{ const h=(+r.tx_count/max)*(H-P.t-P.b);
    const x=P.l+i*gap+(gap-bw)/2, y=H-P.b-h;
    b+=`<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="3" fill="${COLORS[i%COLORS.length]}"/>`+
       `<text class="axis" x="${x+bw/2}" y="${H-10}" text-anchor="middle">${r.channel}</text>`+
       `<text class="axis" x="${x+bw/2}" y="${y-4}" text-anchor="middle">${fmt.format(r.tx_count)}</text>`; });
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}">${b}</svg>`;
}

function donut(el, rows){
  if(!rows||!rows.length){ el.innerHTML='<p class="sub">no data</p>'; return; }
  const total=rows.reduce((s,r)=>s+ +r.gross_base,0)||1;
  const R=78,r=48,cx=100,cy=100; let a=-Math.PI/2, seg='';
  rows.forEach((row,i)=>{ const frac=+row.gross_base/total, a2=a+frac*2*Math.PI;
    const x1=cx+R*Math.cos(a),y1=cy+R*Math.sin(a),x2=cx+R*Math.cos(a2),y2=cy+R*Math.sin(a2);
    const xi2=cx+r*Math.cos(a2),yi2=cy+r*Math.sin(a2),xi1=cx+r*Math.cos(a),yi1=cy+r*Math.sin(a);
    const big=frac>0.5?1:0;
    seg+=`<path d="M${x1} ${y1} A${R} ${R} 0 ${big} 1 ${x2} ${y2} L${xi2} ${yi2} A${r} ${r} 0 ${big} 0 ${xi1} ${yi1} Z" fill="${COLORS[i%COLORS.length]}"/>`;
    a=a2; });
  const leg=rows.map((row,i)=>`<span><i style="background:${COLORS[i%COLORS.length]}"></i>${row.currency_code} · ${money(row.gross_base)}</span>`).join('');
  el.innerHTML=`<svg viewBox="0 0 200 200" style="max-width:200px;margin:0 auto">${seg}
    <text x="100" y="98" text-anchor="middle" class="axis" style="font-size:12px">Total</text>
    <text x="100" y="116" text-anchor="middle" fill="var(--txt)" style="font-size:14px;font-weight:600">${money(total)}</text></svg>
    <div class="legend">${leg}</div>`;
}

function merchTable(el, rows){
  if(!rows||!rows.length){ el.innerHTML='<p class="sub">no data</p>'; return; }
  const max=Math.max(...rows.map(r=>+r.revenue),1);
  el.innerHTML=`<table><thead><tr><th>Merchant</th><th>Revenue</th><th>Tx</th><th>Decline %</th></tr></thead><tbody>`+
    rows.map(r=>{ const w=(+r.revenue/max*100).toFixed(1);
      const dc=+r.decline_rate_pct>10?'var(--bad)':'var(--mut)';
      return `<tr><td>${r.merchant_name}</td>
        <td class="bar-cell"><div style="position:absolute;inset:0;background:${COLORS[0]};opacity:.12;width:${w}%"></div><span style="position:relative">${money(r.revenue)}</span></td>
        <td>${fmt.format(r.tx_count)}</td><td style="color:${dc}">${r.decline_rate_pct}</td></tr>`; }).join('')+
    `</tbody></table>`;
}
main();
</script>
</body>
</html>
